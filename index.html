<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--mute:#5d6b79;--line:#e1e6eb;--brand:#0b6b57;--brand2:#e8f4f0;
--stu:#1d6fdc;--stubg:#e6f0fd;--par:#b45f06;--parbg:#fdf0dc;--tea:#1b7f4b;--teabg:#e2f5ea;--off:#7a3fb5;--offbg:#f0e8fa;--adm:#0e7c86;--admbg:#e0f4f6;
--m:#1d6fdc;--f:#d6336c;--x:#7a3fb5;--hl:#fff3a8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161c;--card:#19212a;--ink:#e8edf2;--mute:#9aa8b6;--line:#2a3541;--brand:#4fcfae;--brand2:#14312b;
--stu:#7ab4ff;--stubg:#16294a;--par:#f3b062;--parbg:#3a2a12;--tea:#6fd69b;--teabg:#12301f;--off:#c39bf0;--offbg:#2c1f40;--adm:#62d3dd;--admbg:#10323a;--m:#7ab4ff;--f:#ff8fb7;--x:#c39bf0;--hl:#5a4d0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 14px}
.org{font-size:13px;color:var(--brand);font-weight:700;letter-spacing:.02em}
h1{margin:4px 0 6px;font-size:clamp(22px,5vw,32px);line-height:1.2}
.meta{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:8px;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row{display:flex;flex-wrap:wrap;gap:8px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=search]{flex:1 1 220px}
select{flex:1 1 140px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.seg small{color:var(--mute);width:56px;font-size:12px}
.seg button{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:36px}
.seg button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.tabs{display:flex;gap:4px;margin:18px 0 10px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:700;background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mute);align-items:center;margin:6px 0 12px}
.count{font-size:14px;color:var(--mute);margin:6px 2px}
.grp{margin:20px 0 8px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp i{font-style:normal;font-size:12px;color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.team{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-left:5px solid var(--c)}
.team.M{--c:var(--m)}.team.F{--c:var(--f)}.team.X{--c:var(--x)}
.th{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px}
.no{font-weight:800;color:var(--mute)}
.tag{padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px;white-space:nowrap}
.tag.M{background:var(--stubg);color:var(--m)}.tag.F{background:#fde6ef;color:var(--f)}.tag.X{background:var(--offbg);color:var(--x)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.F{background:#42202f}}
.tag.lv{background:var(--brand2);color:var(--brand)}
.p{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px}
.p+.p{margin-top:4px}
.p.hit{background:var(--hl)}
.nm{font-weight:700;font-size:16px}
.sc{font-size:12px;color:var(--mute)}
.role{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap}
.r-stu{background:var(--stubg);color:var(--stu)}.r-par{background:var(--parbg);color:var(--par)}.r-tea{background:var(--teabg);color:var(--tea)}.r-off{background:var(--offbg);color:var(--off)}.r-adm{background:var(--admbg);color:var(--adm)}
.vs{display:none}
.school{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.school>summary{cursor:pointer;padding:14px;font-weight:800;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.school>summary::-webkit-details-marker{display:none}
.school>summary:before{content:"▸";color:var(--mute)}
.school[open]>summary:before{content:"▾"}
.school .sub{font-weight:400;font-size:13px;color:var(--mute);margin-left:auto}
.school .grid{padding:0 12px 12px}
.empty{padding:40px;text-align:center;color:var(--mute)}
footer{margin-top:30px;font-size:12px;color:var(--mute)}
.reset{font:inherit;font-size:13px;color:var(--brand);background:none;border:0;cursor:pointer;text-decoration:underline}
@media(max-width:700px){.panel{position:static}.stats{grid-template-columns:repeat(2,1fr)}.seg small{width:100%}}
</style>
</head>

const LVS=['초등','중등','고등'];
const roleCls=r=>r==='학생'?'stu':r==='학부모'||r==='부'?'par':r==='교육지원청'?'off':(r==='교장'||r==='교감')?'adm':'tea';
const roleKey=r=>r==='부'?'학부모':['교무행정사','전문상담사','스포츠강사'].includes(r)?'교직원':r;
const state={q:'',school:'',lv:'',e:'',g:'',role:'',view:'school'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const schools=[...new Set(TEAMS.flatMap(t=>t.p.map(x=>x.s)))].sort((a,b)=>{
 const o=s=>s==='교육지원청'?99:LVS.indexOf(s.includes('초등')?'초등':s.includes('중')?'중등':'고등');
 return o(a)-o(b)||a.localeCompare(b,'ko')});
// team's home school = school of the student
TEAMS.forEach(t=>{const st=t.p.find(x=>x.r==='학생'||x.r==='학부모'&&false)||t.p[1];t.home=st.s;t.sch=[...new Set(t.p.map(x=>x.s))]});
function segs(){
 const defs={lv:['초등','중등','고등'],e:['M','F','X'],g:[1,2,3,4,5,6],role:['학생','학부모','교사','교직원','교장','교감','교육지원청']};
 document.querySelectorAll('.seg').forEach(el=>{const k=el.dataset.k;
  const mk=(v,l)=>{const b=document.createElement('button');b.textContent=l;b.dataset.v=v;b.setAttribute('aria-pressed','false');b.onclick=()=>{state[k]=state[k]==v?'':v;render()};el.appendChild(b)};
  mk('','전체');defs[k].forEach(v=>mk(v,k==='e'?EF[v]:k==='g'?v+'그룹':v))});
 const s=$('#school');s.innerHTML='<option value="">전체 학교·기관</option>'+schools.map(x=>`<option>${x}</option>`).join('');
 s.onchange=()=>{state.school=s.value;render()};
}
function match(t){
 const q=state.q.trim();
 if(q&&!t.p.some(x=>x.m.includes(q)))return false;
 if(state.school&&!t.sch.includes(state.school))return false;
 if(state.lv&&t.l!==state.lv)return false;
 if(state.e&&t.e!==state.e)return false;
 if(state.g&&t.g!=state.g)return false;
 if(state.role&&!t.p.some(x=>roleKey(x.r)===state.role))return false;
 return true;
}
function card(t){
 const q=state.q.trim();
 return `<div class="team ${t.e}"><div class="th"><span class="no">No.${t.n}</span><span class="tag ${t.e}">${EF[t.e]}</span><span class="tag lv">${t.l} ${t.g}그룹</span></div>`+
 t.p.map(x=>`<div class="p ${q&&x.m.includes(q)?'hit':''}"><div><div class="nm">${esc(x.m)}<span class="role r-${roleCls(x.r)}">(${esc(roleKey(x.r))})</span></div><div class="sc">${esc(x.s)}${roleKey(x.r)==='교직원' && x.r!=='교직원'?' · '+esc(x.r):''}</div></div></div>`).join('')+`</div>`;
}
const cmpT=(a,b)=>LVS.indexOf(a.l)-LVS.indexOf(b.l)||'MFX'.indexOf(a.e)-'MFX'.indexOf(b.e)||a.g-b.g||a.n-b.n;
function render(){
 document.querySelectorAll('.seg').forEach(el=>el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(state[el.dataset.k]==b.dataset.v))));
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===state.view)));
 const list=TEAMS.filter(match);
 $('#count').textContent=`검색 결과 ${list.length}팀`+(list.length?` · 참가자 ${list.length*2}명`:'');
 let h='';
 if(!list.length)h='<div class="empty">조건에 맞는 팀이 없습니다.</div>';
 else if(state.view==='school'){
  const by={};list.forEach(t=>t.sch.forEach(s=>(by[s]=by[s]||[]).push(t)));
  const keys=schools.filter(s=>by[s]);
  h=keys.map(s=>{const ts=by[s].sort(cmpT);const ppl=ts.flatMap(t=>t.p).filter(x=>x.s===s);
   const cnt={};ppl.forEach(x=>{const k=roleKey(x.r);cnt[k]=(cnt[k]||0)+1});
   const sub=Object.entries(cnt).map(([k,v])=>`${k} ${v}`).join(' · ');
   return `<details class="school" ${(state.school||state.q||keys.length<=3)?'open':''}><summary>${esc(s)} <span class="tag lv">${ts.length}팀</span><span class="sub">${sub}</span></summary><div class="grid">${ts.map(card).join('')}</div></details>`}).join('');
 }else if(state.view==='div'){
  const by={};list.sort(cmpT).forEach(t=>{const k=`${t.l}|${t.e}|${t.g}`;(by[k]=by[k]||[]).push(t)});
  h=Object.entries(by).map(([k,ts])=>{const[l,e,g]=k.split('|');return `<h3 class="grp"><span class="tag ${e}">${l} ${EF[e]}</span> ${g}그룹 <i>${ts.length}팀</i></h3><div class="grid">${ts.map(card).join('')}</div>`}).join('');
 }else h=`<div class="grid">${list.sort((a,b)=>a.n-b.n).map(card).join('')}</div>`;
 $('#out').innerHTML=h;
}
function init(){
 $('#total').textContent=TEAMS.length;
 const c=(f)=>TEAMS.filter(f).length;
 const stu=TEAMS.flatMap(t=>t.p).filter(x=>x.r==='학생').length;
 const par=TEAMS.flatMap(t=>t.p).filter(x=>roleCls(x.r)==='par').length;
 $('#stats').innerHTML=[[TEAMS.length,'전체 팀'],[stu,'학생'],[par,'학부모'],[LVS.map(l=>c(t=>t.l===l)).join(' / '),'초 / 중 / 고 팀']].map(([a,b])=>`<div class="stat"><b>${a}</b><span>${b}</span></div>`).join('');
 segs();
 $('#q').oninput=e=>{state.q=e.target.value;render()};
 $('#reset').onclick=()=>{Object.assign(state,{q:'',school:'',lv:'',e:'',g:'',role:''});$('#q').value='';$('#school').value='';render()};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render()});
 render();
}
init();
</script>
</body>
</html>
